repos:
  # ── Python: Ruff (lint + format) ──────────────────────────────────
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: ruff format --check
        language: system
        types: [python]

  # ── Frontend: Prettier ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]

  # ── Frontend: ESLint ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [ts, tsx]

  # ── General: whitespace, merge conflicts, large files ─────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
