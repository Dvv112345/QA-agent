[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
description = "QA Agent — accepts source code (zip) and requirement documents (markdown) for analysis"
readme = "backend/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QA Agent Team" }]
keywords = ["qa", "code-review", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.115,<1.0.0",
    "uvicorn[standard]>=0.34,<1.0.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
qa-agent = "backend.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI requires File(...) call in parameter defaults

[tool.ruff.format]
quote-style = "double"
