[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
description = "QA Agent — manages GitHub repositories and QA sprints for automated quality assurance analysis"
readme = "backend/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QA Agent Team" }]
keywords = ["qa", "code-review", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.115,<1.0.0",
    "uvicorn[standard]>=0.34,<1.0.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22",
    "dotenv==0.9.9",
    "rq>=2.0,<3.0",
    "redis>=5.0,<7.0",
    "psycopg2-binary>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "cryptography>=42,<45",
    "openai>=1.40,<3.0",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "playwright>=1.40,<2",
    "requests>=2.31,<3",
    "faker>=24,<26",
    # Round-trip YAML for the CI/CD export: adding a job to a team's existing
    # workflow must leave every other line — comments, quoting, key order —
    # byte-identical. PyYAML cannot do that; it re-serializes the whole file.
    # Upper bound is 0.19 rather than 1.0 because conda pins
    # `ruamel-yaml<0.19` and this project is developed inside a conda
    # environment — a wider range lets `pip install -e .` break the
    # interpreter it was just run with. 0.18 is the floor: `YAML()` is the
    # only round-trip API from that release on.
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
qa-agent = "backend.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI requires File(...) call in parameter defaults

[tool.ruff.format]
quote-style = "double"
