name: Delete Branch After Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;

            // Don't delete main or protected branches
            const protectedBranches = ['main', 'master', 'develop', 'production'];
            if (protectedBranches.includes(branchName)) {
              console.log(`⚠️ Skipping deletion of protected branch: ${branchName}`);
              return;
            }

            try {
              console.log(`🗑️ Deleting branch: ${branchName}`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`✅ Successfully deleted branch: ${branchName}`);
            } catch (error) {
              console.log(`❌ Failed to delete branch: ${error.message}`);
              throw error;
            }
